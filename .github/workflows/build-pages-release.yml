name: Build, Pages, Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy GitHub Pages. Requires Settings > Pages > Source: GitHub Actions."
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Optional release tag to create from this commit, for example v1.2.3."
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build standalone app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node for syntax checks
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify generated artifacts
        run: python3 tools/build.py --check

      - name: Syntax check JavaScript sources
        run: |
          node --check src/app.js
          node --check src/canvas-readback-patch.js
          node --check models/embedded-models.js

      - name: Prepare distributable
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp README.md dist/README.md

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: facetrace-standalone
          path: dist
          if-no-files-found: error

  pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download standalone artifact
        uses: actions/download-artifact@v7
        with:
          name: facetrace-standalone
          path: site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository for manual tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create manual release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          case "$TAG_NAME" in
            v*) ;;
            *)
              echo "release_tag must start with v, for example v1.2.3" >&2
              exit 1
              ;;
          esac

          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/$TAG_NAME"; then
            echo "Tag $TAG_NAME already exists." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME" "$GITHUB_SHA"
          git push origin "$TAG_NAME"

      - name: Download standalone artifact
        uses: actions/download-artifact@v7
        with:
          name: facetrace-standalone
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              release/index.html \
              release/README.md \
              --clobber
          else
            gh release create "$TAG_NAME" \
              release/index.html \
              release/README.md \
              --title "FaceTrace Offline $TAG_NAME" \
              --notes "Standalone offline FaceTrace HTML build. Download index.html and open it locally, or use the GitHub Pages deployment."
          fi
